[project]
name = "gawe"
version = "0.1.0"
description = "Governed Agentic Workflow Engine: policy-enforced, auditable agent orchestration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]
llm = [
    "anthropic>=0.40",
]
anchor = [
    "cryptography>=44",
    "asn1crypto>=1.5",
]
dev = [
    "gawe[db]",
    "gawe[api]",
    "gawe[otel]",
    "gawe[anchor]",
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gawe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["gawe", "bench"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:."
packages = ["gawe", "bench"]

[[tool.mypy.overrides]]
module = ["asn1crypto", "asn1crypto.*"]
ignore_missing_imports = true
