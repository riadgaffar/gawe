# Contract Review policy. Anything not allowed here is denied (default-deny).
# The strictest matching outcome wins: deny > needs_approval > allow.
rules:
  - id: read-tools-allowed
    effect: allow
    when: {side_effect_class: read}

  - id: crm-assessment-allowed
    effect: allow
    when: {tool: crm.write_assessment}

  - id: email-baseline-allowed
    effect: allow
    when: {tool: email.send}

  - id: external-email-needs-legal
    effect: needs_approval
    approver_role: legal_reviewer
    reason: Email to an external recipient needs legal review
    when:
      tool: email.send
      args:
        delivery.mailboxes: {any_domain_not_in: $tenant.internal_domains}

  - id: blocked-domain-email-denied
    effect: deny
    reason: Never email a blocked domain from this workflow
    when:
      tool: email.send
      args:
        delivery.mailboxes: {any_domain_in: $tenant.blocked_domains}

  # A "low risk" assessment is the one an attacker wants (it quietly lowers a contract's risk in
  # the CRM). It needs legal review when the Reader's own findings contradict it, or when the deal
  # is large; $review.* is computed per run by the app (see __init__.py).
  - id: low-risk-contradicted-needs-legal
    effect: needs_approval
    approver_role: legal_reviewer
    reason: A low risk rating contradicts a high-severity clause the Reader flagged
    when:
      tool: crm.write_assessment
      args:
        risk_level: {in: $review.unsupported_levels}

  - id: low-risk-large-deal-needs-legal
    effect: needs_approval
    approver_role: legal_reviewer
    reason: Rating a deal over 100,000 as low risk needs legal review
    when:
      tool: crm.write_assessment
      args:
        risk_level: {eq: low}
        contract_id: {in: $review.large_deals}

  # Provisional (M17, design D4 option B): every "low" rating needs legal review, however small
  # the deal and whatever the Reader flagged, so a fully fooled "low" never writes alone. On 291
  # honest CUAD contracts 2.7% were rated "low" (docs/m17-plan.md, S5); real traffic confirms or
  # reverses it. It comes after the two rules above so their more specific reasons show first.
  # If it is dropped, wire the liability scan in first (see the roadmap).
  - id: low-risk-needs-legal
    effect: needs_approval
    approver_role: legal_reviewer
    reason: A low risk rating needs legal review
    when:
      tool: crm.write_assessment
      args:
        risk_level: {eq: low}

  # M24: a rating lower than the contract's last needs legal, whichever run made the last one, so
  # a downgrade can't be split across runs (high in one, medium in the next). History only ever
  # adds a review: startup refuses $history.* in an allow rule. "low" needs legal anyway (above).
  - id: rating-lowered-needs-legal
    effect: needs_approval
    approver_role: legal_reviewer
    reason: This rating is lower than the contract's last one
    when:
      tool: crm.write_assessment
      args:
        risk_level: {in: $history.lower_ratings}

  - id: signature-standard-needs-legal
    effect: needs_approval
    approver_role: legal_reviewer
    reason: Sending for signature needs legal review
    when:
      tool: esign.send_for_signature
      args:
        deal_value: {lte: 100000}

  - id: signature-high-value-needs-finance
    effect: needs_approval
    approver_role: finance_approver
    reason: Deals over 100,000 need finance approval
    when:
      tool: esign.send_for_signature
      args:
        deal_value: {gt: 100000}

  - id: changed-recipients-need-legal
    effect: needs_approval
    approver_role: legal_reviewer
    reason: Directory changes require a fresh approval of the expanded recipients
    when:
      tool: email.send
      args:
        delivery.reapproval_required: {eq: true}
