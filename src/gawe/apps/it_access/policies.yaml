# IT access policy. Default-deny; the strictest matching outcome wins.
rules:
  - id: lookup-allowed
    effect: allow
    when: {side_effect_class: read}

  - id: grant-baseline-allowed
    effect: allow
    when: {tool: iam.grant_access}

  - id: elevated-access-needs-security
    effect: needs_approval
    approver_role: security_admin
    reason: Admin-level access needs security approval
    when:
      tool: iam.grant_access
      args:
        level: {eq: admin}

  # A system that holds another app's controls (M23): write or admin there could change what
  # that app's policy reads, so a person decides. Read access stays automatic.
  - id: control-system-change-needs-security
    effect: needs_approval
    approver_role: security_admin
    reason: Changing a system that holds another app's controls needs security approval
    when:
      tool: iam.grant_access
      args:
        system: {in: $tenant.control_systems}
        level: {in: [write, admin]}

  - id: production-database-needs-security
    effect: needs_approval
    approver_role: security_admin
    reason: Production database access needs security approval
    when:
      tool: iam.grant_access
      args:
        system: {eq: prod_db}

  # M24: access asked for again and again (weekly re-grants of one system, say) needs a person
  # once one grantee has had that system `automatic_grants` times within `history_days`. History
  # only ever adds a review: startup refuses $history.* in an allow rule.
  - id: repeated-grant-needs-security
    effect: needs_approval
    approver_role: security_admin
    reason: This person has been granted this system repeatedly in the last few weeks
    when:
      tool: iam.grant_access
      args:
        system: {in: $history.repeated_systems}

  - id: external-user-denied
    effect: deny
    reason: Access can only be granted to company accounts
    when:
      tool: iam.grant_access
      args:
        email: {domain_not_in: $tenant.internal_domains}

  # Bind the Planner to this run's Reader report; a fooled Reader can still name the wrong person.
  - id: requester-mismatch-denied
    effect: deny
    reason: Access can only be granted to the requester reported for this run
    when:
      tool: iam.grant_access
      args:
        email: {ne: $request.reported_requester}

  # Who filed the ticket comes from the ticket system, never from the ticket's text. A grant to
  # anyone else (a ticket filed on another's behalf, or a fooled Reader) needs a person (M16c).
  - id: grant-to-other-than-submitter-needs-security
    effect: needs_approval
    approver_role: security_admin
    reason: The access is for someone other than the person who filed the ticket
    when:
      tool: iam.grant_access
      args:
        email: {not_in: $request.submitters}

  # Only a ticket filed through the signed-in portal has a trusted submitter; an emailed or
  # public-form ticket names whoever the sender wrote.
  - id: untrusted-channel-needs-security
    effect: needs_approval
    approver_role: security_admin
    reason: The ticket did not come through the signed-in portal
    when:
      tool: iam.grant_access
      args:
        email: {not_in: $request.portal_submitters}

  # Every grant expires. Preparation sets the end date; this denies a lifetime over the tenant
  # maximum in case preparation or configuration is ever wrong (defense in depth).
  - id: grant-lifetime-over-maximum-denied
    effect: deny
    reason: A grant cannot last longer than the tenant maximum
    when:
      tool: iam.grant_access
      args:
        lifetime_hours: {gt: $tenant.max_grant_lifetime_hours}
